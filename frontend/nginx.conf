server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Static Assets ──────────────────────────────────────
    # Serve built files with aggressive caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── SPA Routing ────────────────────────────────────────
    # Any unknown path falls back to index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API Proxy (optional) ───────────────────────────────
    # Forward /api/* requests to the backend container.
    # Not used by the current dashboard (which calls the backend
    # directly at 127.0.0.1:8000), but useful for future deployment.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}